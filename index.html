<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <h1>Image Converter</h1>
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          data-next-theme="dark"
          aria-pressed="false"
          aria-label="Switch to dark mode"
        >
          <svg class="theme-icon icon-sun" viewBox="0 0 640 640" aria-hidden="true">
            <path d="M320 32C328.4 32 336.3 36.4 340.6 43.7L396.1 136.3L500.9 110C509.1 108 517.8 110.4 523.7 116.3C529.6 122.2 532 131 530 139.1L503.7 243.8L596.4 299.3C603.6 303.6 608.1 311.5 608.1 319.9C608.1 328.3 603.7 336.2 596.4 340.5L503.7 396.1L530 500.8C532 509 529.6 517.7 523.7 523.6C517.8 529.5 509 532 500.9 530L396.2 503.7L340.7 596.4C336.4 603.6 328.5 608.1 320.1 608.1C311.7 608.1 303.8 603.7 299.5 596.4L243.9 503.7L139.2 530C131 532 122.4 529.6 116.4 523.7C110.4 517.8 108 509 110 500.8L136.2 396.1L43.6 340.6C36.4 336.2 32 328.4 32 320C32 311.6 36.4 303.7 43.7 299.4L136.3 243.9L110 139.1C108 130.9 110.3 122.3 116.3 116.3C122.3 110.3 131 108 139.2 110L243.9 136.2L299.4 43.6L301.2 41C305.7 35.3 312.6 31.9 320 31.9zM320 176C240.5 176 176 240.5 176 320C176 399.5 240.5 464 320 464C399.5 464 464 399.5 464 320C464 240.5 399.5 176 320 176zM320 416C267 416 224 373 224 320C224 267 267 224 320 224C373 224 416 267 416 320C416 373 373 416 320 416z"/>
          </svg>
          <svg class="theme-icon icon-moon" viewBox="0 0 640 640" aria-hidden="true">
            <path d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C388.8 576 451.3 548.8 497.3 504.6C504.6 497.6 506.7 486.7 502.6 477.5C498.5 468.3 488.9 462.6 478.8 463.4C473.9 463.8 469 464 464 464C362.4 464 280 381.6 280 280C280 207.9 321.5 145.4 382.1 115.2C391.2 110.7 396.4 100.9 395.2 90.8C394 80.7 386.6 72.5 376.7 70.3C358.4 66.2 339.4 64 320 64z"/>
          </svg>
        </button>
      </div>
      <p>Upload JPG, PNG, WEBP, or HEIC/HEIF files and convert them in your browser.</p>
    </header>

    <section class="panel upload-panel">
      <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Upload images">
        <p><strong>Drop images here</strong> or click to select files</p>
        <p class="subtle">Supported: .jpg, .jpeg, .png, .webp, .heic, .heif</p>
      </div>
      <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.heic,.heif,image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden>
    </section>

    <section class="panel controls-panel">
      <h2>Conversion Settings</h2>
      <div class="controls-grid">
        <label>
          Output Format
          <select id="formatSelect">
            <option value="jpeg">JPEG (.jpg)</option>
            <option value="png">PNG (.png)</option>
            <option value="webp">WEBP (.webp)</option>
          </select>
        </label>

        <label>
          Quality: <span id="qualityValue">85</span>
          <input id="qualityInput" type="range" min="1" max="100" value="85">
        </label>

        <label>
          Resize Mode
          <select id="resizeMode">
            <option value="original">Keep Original</option>
            <option value="percent">Scale by Percent</option>
            <option value="exact">Set Width / Height</option>
          </select>
        </label>

        <label id="percentWrap">
          Scale Percent
          <input id="percentInput" type="number" min="1" max="500" step="1" value="100">
        </label>

        <label id="widthWrap">
          Width (px)
          <input id="widthInput" type="number" min="1" step="1" placeholder="e.g. 1920">
        </label>

        <label id="heightWrap">
          Height (px)
          <input id="heightInput" type="number" min="1" step="1" placeholder="e.g. 1080">
        </label>

        <label class="checkbox-row">
          <input id="keepAspectInput" type="checkbox" checked>
          Keep aspect ratio
        </label>
      </div>

      <div class="actions">
        <button id="downloadAllBtn" type="button" disabled>Download All Converted Files</button>
      </div>
      <p id="summary" class="subtle">No images loaded.</p>
    </section>

    <section class="panel preview-panel">
      <h2>Preview</h2>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <footer class="footer">
    <a
      class="github-link"
      href="https://github.com/yoheiocean/image-converter"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open GitHub repository"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 .5A12 12 0 0 0 8.2 23.9c.6.1.8-.3.8-.6v-2.2c-3.4.8-4.1-1.6-4.1-1.6-.6-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.6-1.4-5.6-6.1 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.2A11.3 11.3 0 0 1 12 6.6c1 0 2 .1 3 .4 2.3-1.6 3.3-1.2 3.3-1.2.7 1.7.2 3 .1 3.3.8.8 1.2 1.9 1.2 3.2 0 4.7-2.9 5.8-5.6 6.1.4.4.8 1 .8 2v3c0 .4.2.7.8.6A12 12 0 0 0 12 .5z"
        />
      </svg>
      <span>yoheiocean/image-converter</span>
    </a>
  </footer>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-header">
        <h3 class="file-name"></h3>
        <button class="remove-btn" type="button">Remove</button>
      </div>
      <div class="thumbs">
        <figure>
          <figcaption>Original</figcaption>
          <img class="original-preview" alt="Original preview">
        </figure>
        <figure>
          <figcaption>Converted</figcaption>
          <img class="converted-preview" alt="Converted preview">
        </figure>
      </div>
      <p class="meta original-meta"></p>
      <p class="meta converted-meta">Converting preview...</p>
      <div class="card-actions">
        <button class="download-btn" type="button" disabled>Download</button>
      </div>
    </article>
  </template>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="lightbox-inner">
      <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Close preview">Close</button>
      <div class="lightbox-stage">
        <img id="lightboxImage" alt="Large preview">
      </div>
      <p id="lightboxMeta" class="lightbox-meta"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
